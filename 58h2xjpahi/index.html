(async()=>{
  const k=new URLSearchParams(location.hash.slice(1)).get("k");
  if(!k) return;
  const dec=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; return Uint8Array.from(atob(s),c=>c.charCodeAt(0));};
  try{
    const key=await crypto.subtle.importKey("raw",dec(k),"AES-GCM",false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:dec(IV)},key,dec(CT));
    const html=new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  }catch(e){ document.getElementById("m").textContent="This link isn't valid."; }
})();
