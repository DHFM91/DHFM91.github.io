<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#efebf3">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>table — David Feuling</title>
<meta name="description" content="table, a browser game by David Feuling and Paul Brinnel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f2;
    --hero: #efebf3;
    --line: #e3dde6;
    --text: #26222b;
    --muted: #6c6672;
    --accent: #6a4c9c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 15px/1.4 Inter, system-ui, sans-serif;
  }
  .bar {
    flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; background: var(--hero); border-bottom: 1px solid var(--line);
  }
  .bar a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .bar a:hover { text-decoration: underline; }
  .bar h1 { font: 700 20px Fraunces, Georgia, serif; margin: 0; }
  .bar .by { color: var(--muted); font-size: 13px; }
  .game { flex: 1; min-height: 0; }
  .game iframe { display: block; width: 100%; height: 100%; border: 0; background: #000; }
  @media (max-width: 520px) { .bar .by { display: none; } }
</style>
</head>
<body>
  <div class="bar">
    <a href="/">&larr; Home</a>
    <h1>table</h1>
    <span class="by">by David Feuling &amp; Paul Brinnel</span>
  </div>
  <div class="game">
    <iframe src="https://paulbrinnel.com/table/" title="table" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
  </div>
</body>
</html>
